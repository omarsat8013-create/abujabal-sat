<script>
/* ES5 only: early error banner so a JS failure is visible (and screenshot-able) instead of silent empty sections */
window.__ajsErrShown=false;
function __ajsShowErr(msg){
  if(window.__ajsErrShown)return; window.__ajsErrShown=true;
  var d=document.createElement('div');
  d.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 12px;font-size:13px;direction:rtl;text-align:right;font-family:sans-serif';
  d.textContent='حصل خطأ في التحميل: '+msg+' — ابعت صورة الشاشة دي لو سمحت';
  (document.body||document.documentElement).appendChild(d);
}
window.addEventListener('error',function(e){ __ajsShowErr(e.message||'script error'); },true);
window.addEventListener('unhandledrejection',function(e){ __ajsShowErr((e.reason&&e.reason.message)||'async error'); });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ابوجبل سات - محرر القنوات الاحترافي</title>
<meta name="description" content="ابوجبل سات: محرر قنوات احترافي للفني - أقمار وترددات وقنوات، أدوات ترتيب وتعريب وبحث عن المكرر، تصدير لكل صيغ الأجهزة، مكتبة سوفتات ومرجع لودرات.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1226">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ابوجبل سات">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1122; --panel:#101b31; --panel2:#0c1526; --line:#1f2d50; --line2:#27396b;
  --txt:#e7edfa; --mut:#8fa0c2; --teal:#2dd4bf; --teal2:#0d9488; --gold:#f0b429;
  --blue:#3b82f6; --danger:#ef4444; --sel:#1a3a63; --shadow:0 10px 30px rgba(2,8,23,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%, #12203f 0%, var(--bg) 55%);
  color:var(--txt);
  font-family:"Tajawal","Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button{font:inherit}
input,select,textarea{font:inherit;color:var(--txt)}
a{color:var(--teal)}
.hidden-input{display:none}
/* ===== titlebar ===== */
.titlebar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  background:linear-gradient(180deg,#0e1930,#0b1327);
  border-bottom:1px solid var(--line2);
}
.titlebar .logo{width:38px;height:38px;flex-shrink:0}
.titlebar .logo svg{width:100%;height:100%;display:block;border-radius:10px}
.titlebar .tt{flex:1;min-width:0}
.brand{font-size:20px;font-weight:800;line-height:1.2}
.brand b{color:var(--gold);font-weight:800}
.tag{font-size:11.5px;color:var(--mut)}
.verchip{font-size:11px;border:1px solid var(--line2);color:var(--mut);border-radius:999px;padding:3px 10px;white-space:nowrap}
/* ===== sections tabs ===== */
.tabs{
  position:sticky;top:59px;z-index:35;
  display:flex;gap:2px;overflow-x:auto;
  background:rgba(10,17,34,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:0 12px;
}
.tabs button{
  appearance:none;background:none;border:0;cursor:pointer;
  color:var(--mut);padding:12px 14px;min-height:46px;white-space:nowrap;
  border-bottom:2px solid transparent;
}
.tabs button.on{color:var(--txt);font-weight:700;border-bottom-color:var(--teal)}
.wrap{max-width:1280px;margin:0 auto;padding:14px 14px 46px}
.narrow{max-width:840px;margin:0 auto}
/* ===== buttons ===== */
.btn{appearance:none;border:1px solid var(--line2);background:#15213c;color:var(--txt);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--teal2)}
.btn-primary{background:linear-gradient(180deg,#14b8a6,#0d9488);border-color:#0f766e;color:#04211d;font-weight:700}
.btn-gold{background:linear-gradient(180deg,#fbbf24,#d97706);border-color:#b45309;color:#221503;font-weight:700}
.btn-sec{background:#1b2a4d}
.btn-ghost{background:transparent}
.btn-danger{background:#3f1d1d;border-color:#7f1d1d;color:#fecaca}
.btn.sm{padding:5px 10px;min-height:34px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ===== cards / shared ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.card h2 .sub{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}
.caption{font-size:12px;color:var(--mut);margin:8px 2px}
.callout{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;background:var(--panel2)}
.callout b{display:block;margin-bottom:4px}
.callout.note{border-color:#134e4a}
.callout.note b{color:var(--teal)}
.callout.warn{border-color:#713f12}
.callout.warn b{color:var(--gold)}
.callout.danger{border-color:#7f1d1d;background:#1c0f14}
.callout.danger b{color:#f87171}
.mguide{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mguide h3{margin:0 0 8px;font-size:16px}
.mguide .fam{display:inline-block;font-size:10.5px;border:1px solid var(--line2);color:var(--mut);border-radius:999px;padding:1px 9px;margin-inline-start:8px}
.mguide ol.steps{margin:8px 0 0;padding-inline-start:18px}
.mguide ol.steps li{margin-bottom:7px;font-size:13.5px;line-height:1.7}
.mguide ol.steps li b{color:var(--teal)}
.mguide ol.steps li .v{color:var(--gold);font-weight:700;direction:ltr;unicode-bidi:embed}
.mdiagram{background:#0b1425;border:1px solid var(--line2);border-radius:12px;padding:10px;margin:10px 0;overflow-x:auto}
.mdiagram svg{display:block;min-width:700px;width:100%;height:auto}
.mdisc{font-size:11px;color:var(--mut);margin-top:6px;text-align:center}
/* ===== multimeter simulator ===== */
.simgrid{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
@media (max-width:980px){.simgrid{grid-template-columns:1fr}}
.meter{background:#101c3a;border:1px solid var(--line2);border-radius:16px;padding:14px;position:sticky;top:70px}
@media (max-width:980px){.meter{position:static}}
.lcd{background:#0a1220;border:2px solid #1d2c52;border-radius:10px;padding:14px 12px;text-align:center;margin-bottom:10px;min-height:86px}
.lcd .val{font-size:34px;font-weight:800;color:#7ef29a;direction:ltr;font-variant-numeric:tabular-nums}
.lcd .unit{font-size:13px;color:#7ef29a;opacity:.85}
.lcd .tpn{font-size:12px;color:var(--mut);margin-top:4px}
.lcd .idle{font-size:14px;color:var(--mut);padding:18px 0}
.mbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.mbtns button{appearance:none;border:1px solid var(--line2);background:#15213c;color:var(--txt);border-radius:9px;padding:8px 4px;font-size:12px;cursor:pointer;min-height:40px}
.mbtns button.on{background:#0d9488;border-color:#0f766e;font-weight:700}
.simfaults{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.simfaults button{appearance:none;border:1px solid var(--line2);background:#15213c;color:var(--txt);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
.simfaults button.on{background:#7f1d1d;border-color:#b91c1c;font-weight:700}
.simfaults button.ok.on{background:#14532d;border-color:#15803d}
.tpdot{cursor:pointer;fill:#14b8a6;stroke:#04211d;stroke-width:2}
.tpdot:hover{fill:#2dd4bf}
.tpdot.sel{fill:#fbbf24;stroke:#7c2d12}
.simcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.simcmp>div{border-radius:10px;padding:9px 10px;font-size:12.5px}
.simcmp .okb{background:#0f2b1e;border:1px solid #14532d}
.simcmp .badb{background:#331017;border:1px solid #7f1d1d}
.simcmp b{display:block;margin-bottom:3px}
.simproc{font-size:12.5px;color:var(--mut);line-height:1.7;margin-top:10px;border-top:1px dashed var(--line2);padding-top:9px}
.simsuspect{font-size:12.5px;line-height:1.8}
.simsuspect b{color:var(--gold)}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.field input[type=text],.field input:not([type]),.field select{width:100%;background:#0b1425;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-height:42px}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal)}

.btn.big{padding:12px 18px;font-size:15px;min-height:48px;border-radius:12px}
.labbanner{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:16px;margin-bottom:14px;background:linear-gradient(120deg,#0f1f42,#132a5c 55%,#3b2a10);border:1px solid var(--line)}
.labbanner .bico{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#14b8a6,#0d9488);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px rgba(20,184,166,.35)}
.labbanner h2{margin:0;font-size:19px}
.labbanner p{margin:2px 0 0;font-size:12.5px;color:var(--mut)}
.labgrid2{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.labgrid2{grid-template-columns:1fr}}
.labside .card{margin-bottom:12px}
.toolcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.toolhead{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolhead .tico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.toolhead h2{margin:0;font-size:15.5px}
.toolhead .sub{display:block;font-size:11.5px;color:var(--mut);font-weight:400;margin-top:1px}
.toolbody{padding:14px}
.t-blue .tico{background:linear-gradient(135deg,#1d4ed8,#3b82f6);box-shadow:0 3px 10px rgba(59,130,246,.35)}
.t-gold .tico{background:linear-gradient(135deg,#b45309,#fbbf24);box-shadow:0 3px 10px rgba(251,191,36,.3)}
.t-purple .tico{background:linear-gradient(135deg,#6d28d9,#a855f7);box-shadow:0 3px 10px rgba(168,85,247,.35)}
.t-orange .tico{background:linear-gradient(135deg,#c2410c,#fb923c);box-shadow:0 3px 10px rgba(251,146,60,.35)}
.t-teal .tico{background:linear-gradient(135deg,#0f766e,#2dd4bf);box-shadow:0 3px 10px rgba(45,212,191,.3)}
.t-red .tico{background:linear-gradient(135deg,#991b1b,#f87171);box-shadow:0 3px 10px rgba(248,113,113,.3)}
.labstatus{position:sticky;bottom:0;background:rgba(8,14,30,.96);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;backdrop-filter:blur(6px);margin-top:6px}
.labstatus .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.hexview{font-family:monospace;font-size:12px;direction:ltr;text-align:left;background:#0b1425;border:1px solid var(--line2);border-radius:10px;padding:10px;overflow-x:auto;white-space:pre;line-height:1.5}
.hexview .of{color:#5b6b8c}.hexview .as{color:#8fb3a8}
.opok{color:#34d399}.operr{color:#f87171}.opwarn{color:#fbbf24}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv b{font-weight:600}
.mediaitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;direction:ltr;font-size:12.5px;font-family:monospace}
.chrow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.chrow input{background:#0b1425;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;min-height:34px;width:100%}
.labops{max-height:200px;overflow:auto;font-size:12.5px}
.labops div{padding:3px 0;border-bottom:1px dashed var(--line)}
.labnote{font-size:12.5px;color:var(--mut);line-height:1.7}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{appearance:none;border:1px solid var(--line2);background:#0b1425;color:var(--mut);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:38px}
.choices button.on{background:rgba(45,212,191,.14);border-color:var(--teal);color:var(--teal);font-weight:700}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row .main{flex:1;min-width:0}
.row .name{font-weight:700}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--mut);margin-top:3px}
.row .notes{font-size:12px;color:var(--mut);margin-top:3px}
.row .actions{display:flex;gap:6px;flex-shrink:0}
.badge{font-size:10.5px;border:1px solid var(--line2);border-radius:999px;padding:2px 8px;color:var(--mut)}
.badge.kind{color:var(--gold);border-color:#713f12}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:8px;background:#15213c;color:var(--mut);font-size:12px}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fam{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.fam .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fam .nm{font-weight:800}
.fam .ct{font-size:11px;color:var(--mut)}
.fam .ds{font-size:12px;color:var(--mut);margin-top:6px}
.drop{display:block;border:1.5px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;cursor:pointer;margin-bottom:14px;background:rgba(45,212,191,.04)}
.drop .t{display:block;font-weight:800}
.drop .s{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.loader{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
.loader .head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.loader .nm{font-weight:800}
.loader .does{font-size:13px;color:var(--mut);margin-top:6px}
ol.steps{margin:10px 0 0;padding:0 18px 0 0;font-size:13px}
ol.steps li{margin-bottom:5px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact .k{font-size:11.5px;color:var(--mut)}
.fact .v{font-size:20px;font-weight:800;margin-top:2px}
.install{background:linear-gradient(135deg,#123047,#0d2b2a);border:1px solid #134e4a;border-radius:16px;padding:18px;margin-bottom:14px}
.install p{font-size:13px;color:var(--mut);margin:6px 0 10px}
.install .how{font-size:12px;color:var(--mut);margin-top:10px;border-top:1px dashed #134e4a;padding-top:10px}
.hero{border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.hero img{width:100%;display:block}
.footer{margin-top:22px;font-size:11.5px;color:var(--mut);text-align:center;line-height:1.9}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0d9488;color:#04211d;font-weight:700;border-radius:999px;padding:10px 20px;z-index:300;box-shadow:var(--shadow)}
/* ===== channel editor ===== */
.edhead{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:16px;background:linear-gradient(135deg,#16244a 0%,#0d1a33 60%,#0b1527 100%);padding:16px;margin-bottom:12px}
.edhead .row1{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.edhead .ttl{flex:1;min-width:220px}
.edhead h1{margin:0;font-size:19px;font-weight:800}
.edhead h1 b{color:var(--gold)}
.edhead .sub2{font-size:12px;color:var(--mut);margin-top:3px}
.edhead .acts{display:flex;flex-wrap:wrap;gap:8px}
.menubar{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;position:relative;z-index:30}
.menu{position:relative}
.menu>button{appearance:none;background:none;border:0;color:var(--mut);padding:8px 14px;min-height:38px;border-radius:8px;cursor:pointer}
.menu.open>button,.menu>button:hover{background:#15213c;color:var(--txt)}
.drop-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:260px;background:#0f1a30;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60}
.menu.open .drop-menu{display:block}
.drop-menu button{display:flex;width:100%;text-align:right;align-items:center;gap:8px;appearance:none;background:none;border:0;color:var(--txt);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
.drop-menu button:hover{background:#1a2a4d}
.drop-menu .sep{height:1px;background:var(--line);margin:5px 8px}
.seg{display:none;gap:6px;margin-bottom:10px}
.seg button{flex:1;appearance:none;border:1px solid var(--line2);background:var(--panel2);color:var(--mut);border-radius:10px;padding:9px;cursor:pointer;font-weight:700}
.seg button.on{background:rgba(45,212,191,.14);border-color:var(--teal);color:var(--teal)}
.edgrid{display:grid;grid-template-columns:270px 370px 1fr;gap:12px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.phead h3{margin:0;font-size:15px;font-weight:800;flex:1}
.phead h3::before{content:"";display:inline-block;width:4px;height:14px;background:var(--gold);border-radius:2px;margin-left:7px;vertical-align:-2px}
.cnt{font-size:10.5px;background:#15213c;border:1px solid var(--line2);color:var(--mut);border-radius:999px;padding:2px 9px;white-space:nowrap}
.psearch{padding:8px 10px;border-bottom:1px solid var(--line)}
.psearch input{width:100%;background:#0b1425;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;min-height:36px;font-size:13px}
.psearch input:focus{outline:none;border-color:var(--teal)}
.ptools{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.ptools select{background:#0b1425;border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font-size:12px;min-height:32px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);cursor:pointer}
.ptable{overflow:auto;max-height:480px;flex:1}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
table.grid th{position:sticky;top:0;background:#0c1526;color:var(--mut);font-weight:500;font-size:11.5px;padding:7px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;z-index:2}
table.grid td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--txt)}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:#13203c}
table.grid tbody tr.sel{background:var(--sel)}
table.grid td.cname{white-space:normal;min-width:130px;font-weight:600}
table.grid .wname{font-weight:800;letter-spacing:.7px}
.star{appearance:none;background:none;border:0;cursor:pointer;font-size:15px;color:#3b4a6e;padding:0 2px;line-height:1}
.star.on{color:var(--gold)}
body.compact table.grid td{padding:4px 8px;font-size:12px}
body.boldtable table.grid td{font-weight:700}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.statusbar{position:sticky;bottom:8px;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:#0b1327;border:1px solid var(--line2);border-radius:12px;padding:8px 14px;margin-top:12px;font-size:12px;color:var(--mut);box-shadow:var(--shadow)}
.statusbar .st{display:flex;align-items:center;gap:6px;color:var(--teal);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block}
.dot.mod{background:var(--gold)}
.statusbar .fname{margin-inline-start:auto;color:var(--gold);font-weight:700}
/* ===== modal ===== */
.mback{position:fixed;inset:0;background:rgba(3,7,18,.72);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:470px;max-height:88vh;overflow:auto;background:#0f1a30;border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow)}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16px;flex:1}
.mx{appearance:none;background:#15213c;border:1px solid var(--line2);color:var(--mut);width:30px;height:30px;border-radius:8px;cursor:pointer}
.mbody{padding:16px}
.mfoot{display:flex;gap:8px;justify-content:flex-start;padding:12px 16px;border-top:1px solid var(--line)}
.mnote{font-size:12px;color:var(--mut);margin-top:10px}
/* ===== advanced drawer ===== */
.dback{position:fixed;inset:0;background:rgba(3,7,18,.55);z-index:85;display:none}
.dback.open{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,92vw);background:#0c1425;border-inline-end:1px solid var(--line2);z-index:90;transform:translateX(-105%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dhead h3{margin:0;flex:1;font-size:16px}
.drawer .dhead small{display:block;color:var(--mut);font-weight:400}
.drawer .dbody{overflow:auto;padding:10px 14px;flex:1}
.dgroup .gt{font-size:12.5px;color:var(--teal);font-weight:800;margin:14px 2px 8px}
.ditem{display:block;width:100%;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;color:var(--txt);font-size:13.5px}
.ditem:hover{border-color:var(--teal2)}
.ditem small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.ditem.soon{opacity:.55;cursor:default}
.ditem.soon:hover{border-color:var(--line)}
.soonbadge{font-size:10px;border:1px solid #713f12;color:var(--gold);border-radius:999px;padding:1px 7px;margin-inline-start:6px}
@media (max-width:980px){
  .edgrid{grid-template-columns:1fr}
  .seg{display:flex}
  .panel{display:none}
  .panel.active{display:flex}
  .ptable{max-height:56vh}
  /* phone: tabs become a fixed bottom nav bar (standard Android pattern, no top clipping) */
  .tabs{top:auto;position:fixed;bottom:0;left:0;right:0;z-index:60;
    background:#0a1122;border-top:1px solid var(--line);border-bottom:0;
    padding:0 6px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:10px 12px;min-height:54px;font-size:12.5px;
    border-bottom:0;border-top:2px solid transparent;flex-shrink:0}
  .tabs button.on{border-top-color:var(--teal);border-bottom-color:transparent}
  .wrap{padding-bottom:80px}
}

/* ===== home screen (receiver-style icon grid) ===== */
.homehero{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:20px;padding:26px 18px 20px;margin-bottom:14px;background:radial-gradient(900px 400px at 85% -20%,#1d3a6e 0%,transparent 60%),radial-gradient(700px 500px at 10% 120%,#0d3b3a 0%,transparent 55%),linear-gradient(180deg,#0c1730,#0a1122)}
.homehero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,rgba(255,255,255,.5) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70px 90px,rgba(255,255,255,.35) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 130px 40px,rgba(255,255,255,.4) 50%,transparent 51%),radial-gradient(2px 2px at 200px 110px,rgba(255,255,255,.3) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 260px 60px,rgba(255,255,255,.35) 50%,transparent 51%);background-size:300px 150px;opacity:.55}
.homehero .inner{position:relative}
.hometitle{font-size:34px;font-weight:800;margin:0;line-height:1.25}
.hometitle b{color:var(--gold)}
.hometag{color:var(--mut);font-size:13px;margin-top:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-decoration:none;color:#fff;border-radius:16px;padding:14px;min-height:112px;border:1px solid rgba(255,255,255,.14);overflow:hidden;box-shadow:var(--shadow)}
.tile:hover{filter:brightness(1.12)}
.tile .tic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.tile .tic svg{width:26px;height:26px}
.tile .tn{font-weight:800;font-size:15px}
.tile .td{font-size:11px;color:rgba(255,255,255,.78)}
.tile.teal{background:linear-gradient(135deg,#0d9488,#115e59)}
.tile.gold{background:linear-gradient(135deg,#d97706,#92400e)}
.tile.blue{background:linear-gradient(135deg,#2563eb,#1e3a8a)}
.tile.purple{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.tile.slate{background:linear-gradient(135deg,#334155,#0f172a)}
</style>

/* IndexedDB: الملفات نفسها بتتخزن جوه البرنامج هنا */
let db=null;
function openDB(){
  return new Promise((resolve)=>{
    if(!('indexedDB' in window)) return resolve(null);
    const req=indexedDB.open('abujabal-sat',1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore('files'); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>resolve(null);
  });
}
function idbPut(id, blob){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readwrite');
    tx.objectStore('files').put(blob,id);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
function idbGet(id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readonly');
    const rq=tx.objectStore('files').get(id);
    rq.onsuccess=()=>resolve(rq.result||null); rq.onerror=()=>reject(rq.error);
  });
}
function idbDel(id){
  return new Promise((resolve)=>{
    const tx=db.transaction('files','readwrite');
    tx.objectStore('files').delete(id);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>resolve();
  });
}
function downloadBlob(blob, name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name||'file';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function bindLibrary(){
  const pick=$('#pickFile');
  if(pick) pick.addEventListener('change',()=>{
    const f=pick.files&&pick.files[0];
    if(f){ regState.file=f; regState.size=f.size; if(!regState.name) regState.name=f.name; render(); }
  });
  const nf=$('#fName'); if(nf) nf.addEventListener('input',()=>regState.name=nf.value);
  const pf=$('#fPlace'); if(pf) pf.addEventListener('input',()=>regState.place=pf.value);
  const tf=$('#fNotes'); if(tf) tf.addEventListener('input',()=>regState.notes=tf.value);
  const fam=$('#fFamily'); if(fam) fam.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ regState.family=b.dataset.v; render(); } });
  const kind=$('#fKind'); if(kind) kind.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ regState.kind=b.dataset.v; render(); } });
  const lf=$('#libFilter'); if(lf) lf.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ libFilter=b.dataset.v; confirmDel=''; render(); } });
  const save=$('#saveFile');
  if(save) save.addEventListener('click', async ()=>{
    const name=(regState.name||'').trim();
    if(!name){ toast('اكتب اسم الملف أو اختاره من جهازك الأول'); return; }
    const entry={ id:uid(), name, family:regState.family, kind:regState.kind,
      place:(regState.place||'').trim(), notes:(regState.notes||'').trim(),
      size:regState.size||0, addedAt:new Date().toISOString(), hasFile:false };
    if(regState.file && db){
      try{ await idbPut(entry.id, regState.file); entry.hasFile=true; }
      catch(e){ toast('الملف اتسجل، بس متخزنش جوه البرنامج'); }
    }
    catalog=catalog.concat([entry]); saveLS(LS_CATALOG,catalog);
    regState={ name:'', size:0, file:null, family:regState.family, kind:regState.kind, place:'', notes:'' };
    toast('اتسجل في المكتبة: '+name);
    render();
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ confirmDel=b.dataset.del; render(); }));
  document.querySelectorAll('[data-del-confirm]').forEach(b=>b.addEventListener('click', async ()=>{
    const id=b.dataset.delConfirm;
    catalog=catalog.filter(f=>f.id!==id); saveLS(LS_CATALOG,catalog);
    if(db) await idbDel(id);
    confirmDel=''; toast('اتمسح'); render();
  }));
  document.querySelectorAll('[data-dl]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!db) return;
    const entry=catalog.find(f=>f.id===b.dataset.dl);
    try{
      const blob=await idbGet(b.dataset.dl);
      if(blob) downloadBlob(blob, entry?entry.name:'file');
      else toast('الملف مش متخزن جوه البرنامج');
    }catch(e){ toast('حصلت مشكلة في قراءة الملف'); }
  }));
}

function visSats(){
  const q=satQ.trim();
  return editor.sats.filter(s=>!q||s.name.includes(q)||(s.pos||'').includes(q));

function visTps(){
  const q=tpQ.trim();
  return editor.tps.filter(t=>(edSat==='all'||t.satId===edSat)&&(!q||t.freq.includes(q)||t.sr.includes(q)||(t.prov||'').includes(q)));

function visChs(){
  const q=chQ.trim();
  let arr=editor.chs.filter(c=>
    (edSat==='all'||c.satId===edSat)&&
    (!edTp||c.tpId===edTp)&&
    (chType==='الكل'||(chType==='مفضلة'?c.fav:c.type===chType))&&
    (chCat==='الكل'||c.cat===chCat)&&
    (!q||c.name.includes(q)||String(c.no)===q));
  if(chSort==='no-asc') arr=arr.slice().sort((a,b)=>a.no-b.no);
  else if(chSort==='no-desc') arr=arr.slice().sort((a,b)=>b.no-a.no);
  else if(chSort==='name') arr=arr.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  return arr;
}

function findDuplicates(){
  const groups={};
  editor.chs.forEach(c=>{ const k=c.name.trim().replace(/\s+/g,' '); (groups[k]=groups[k]||[]).push(c); });
  const dups=Object.keys(groups).filter(k=>groups[k].length>1);
  if(!dups.length){ openModal('بحث عن المكرر','<p>مفيش قنوات مكررة بالاسم في الملف.</p>',null); return; }
  const body='<p>اتلاقى '+dups.length+' اسم مكرر:</p><div style="max-height:300px;overflow:auto">'+
    dups.map(k=>'<div class="row" style="margin-bottom:6px"><div class="main"><div class="name">'+esc(k)+'</div><div class="meta">'+groups[k].length+' نسخة</div></div></div>').join('')+
    '</div><p class="mnote">حذف المكرر بيخلي أول نسخة من كل اسم ويمسح الباقي.</p>';
  openModal('بحث عن المكرر',body,'حذف المكررات',()=>{
    const seen={}, keep=[];
    editor.chs.forEach(c=>{ const k=c.name.trim().replace(/\s+/g,' '); if(seen[k]) return; seen[k]=1; keep.push(c); });
    const removed=editor.chs.length-keep.length;
    editor.chs=keep; renumber(); markDirty(); render(); toast('اتمسحت '+removed+' قناة مكررة');
  });
}

function normLatin(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function arabizeFromFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    const map={};
    String(rd.result||'').split(/\r?\n/).forEach(l=>{
      const p=l.split(/[=:|،,]/).map(x=>x.trim()).filter(Boolean);
      if(p.length>=2&&/[A-Za-z]/.test(p[0])) map[normLatin(p[0])]=p[1];
    });
    let n=0;
    editor.chs.forEach(c=>{
      if(/[A-Za-z]/.test(c.name)){
        const ar=map[normLatin(c.name)];
        if(ar){ c.name=ar; n++; }
      }
    });
    if(n>0){ markDirty(); render(); toast('اتعربت '+n+' قناة'); }
    else toast('مفيش أسماء اتطابقت - لازم كل سطر يكون: الاسم اللاتيني = الاسم العربي');
  };
  rd.readAsText(file);
}
function openChannelFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const text=String(rd.result||'');
      if(/\.json$/i.test(file.name)||text.trim().startsWith('{')){
        const data=JSON.parse(text);
        if(data&&Array.isArray(data.sats)&&Array.isArray(data.tps)&&Array.isArray(data.chs)){
          editor=data; editor.dirty=false; edSat='all'; edTp=null; edCh=null;
          saveLS(LS_EDITOR,editor); render(); toast('تم فتح الملف'); return;
        }
        throw new Error('bad');
      }
      const added=importTextLines(text);
      if(added>0){ markDirty(); render(); toast('اتضافت '+added+' قناة من الملف'); }
      else toast('مقدرتش أقرأ قنوات من الملف ده');
    }catch(e){ toast('الملف ده مش بصيغة معروفة عند البرنامج'); }
  };
  rd.readAsText(file);
}
function importTextLines(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')&&!l.startsWith('الرقم'));
  if(!lines.length) return 0;
  const satId=(edSat!=='all')?edSat:(editor.sats[0]?editor.sats[0].id:null);
  if(!satId) return 0;
  let added=0;
  let no=editor.chs.reduce((m,c)=>Math.max(m,c.no||0),0);
  lines.forEach(l=>{
    let name='', freq='', pol='V', sr='27500', sid=0;
    const cells=l.split(/[,\t;]/).map(x=>x.trim().replace(/^"|"$/g,''));
    if(cells.length>=7&&/^\d+$/.test(cells[4]||'')){
      name=cells[1]; freq=cells[4]; pol=cells[5]==='H'?'H':'V'; sr=cells[6]||'27500'; sid=parseInt(cells[7],10)||0;
    } else {
      const m=l.match(/^(.+?)\s*[-–]\s*(\d{4,5})\s*([HVhv])?\s*(\d{4,5})?/);
      if(m){ name=m[1].trim(); freq=m[2]; pol=(m[3]||'V').toUpperCase(); sr=m[4]||'27500'; }
      else name=l;
    }
    if(!name) return;
    let tp=freq?editor.tps.find(t=>t.satId===satId&&t.freq===freq):null;
    if(!tp&&freq){ tp={id:uid(),satId,freq,sr,pol,prov:''}; editor.tps.push(tp); }
    if(!tp){ tp=editor.tps.find(t=>t.satId===satId)||editor.tps[0]||null; }
    if(!tp) return;
    const base=1000+editor.chs.length*7;
    editor.chs.push({ id:uid(), satId, tpId:tp.id, no:++no, name, type:'TV', cat:'أخرى', sid:sid||base, pid:(sid||base)+100, pmt:(sid||base)+200, wide:false, fav:false });
    added++;
  });
  return added;
}

}

function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });
}
function dataURLToBlob(d){
  const parts=String(d).split(',');
  const mime=(parts[0].match(/data:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(parts[1]||'');
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

    for(const f of catalog){
      if(f.hasFile&&db){
        try{ const blob=await idbGet(f.id); if(blob) files.push({id:f.id,data:await blobToDataURL(blob)}); }catch(e){}
      }
    }
    const payload={ app:'abujabal-sat', kind:'full-backup', version:3, exportedAt:new Date().toISOString(), editor, catalog, files };
    const stamp=new Date().toISOString().slice(0,10);
    downloadBlob(new Blob([JSON.stringify(payload)],{type:'application/json'}),'abujabal-sat-backup-'+stamp+'.json');
    toast('اتجهزت النسخة الاحتياطية: '+editor.chs.length+' قناة و '+catalog.length+' ملف مكتبة'+(files.length?' ('+files.length+' متخزن)':''));
  }catch(e){ toast('حصلت مشكلة في تجهيز النسخة الاحتياطية'); }
}
function restoreAll(file){
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const data=JSON.parse(String(rd.result||''));
      if(!data||data.kind!=='full-backup'||!data.editor||!Array.isArray(data.catalog)){ toast('الملف ده مش نسخة احتياطية من البرنامج'); return; }
      editor=data.editor; editor.dirty=false;
      catalog=data.catalog;
      saveLS(LS_EDITOR,editor); saveLS(LS_CATALOG,catalog);
      let restored=0;
      if(db&&Array.isArray(data.files)){
        for(const f of data.files){
          try{ await idbPut(f.id, dataURLToBlob(f.data)); restored++; }catch(e){}
        }
      }
      edSat='all'; edTp=null; edCh=null; satQ=tpQ=chQ=''; chType='الكل'; chCat='الكل'; chSort='file';
      render();
      toast('اترجعت النسخة: '+editor.chs.length+' قناة و '+catalog.length+' ملف مكتبة'+(restored?' ('+restored+' متخزن)':''));
    }catch(e){ toast('مقدرتش أقرأ النسخة الاحتياطية دي'); }
  };
  rd.readAsText(file);
}

function editorClick(e){
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;
  if(act==='menu'){
    const m=el.parentElement, was=m.classList.contains('open');
    closeMenus(); if(!was) m.classList.add('open');
    return;
  }
  if(act==='seg'){ edPanel=id; render(); return; }
  if(act==='adv-open'){ closeMenus(); const d=$('#advDrawer'),b=$('#advBack'); if(d) d.classList.add('open'); if(b) b.classList.add('open'); return; }
  if(act==='adv-close'){ const d=$('#advDrawer'),b=$('#advBack'); if(d) d.classList.remove('open'); if(b) b.classList.remove('open'); return; }
  /* selections */
  if(act==='sat-sel'){ edSat=id; edTp=null; refreshTables(); return; }
  if(act==='tp-sel'){ edTp=(edTp===id?null:id); refreshTables(); return; }
  if(act==='ch-sel'){ edCh=id; refreshTables(); return; }
  if(act==='ch-fav'){ const c=chById(id); if(c){ c.fav=!c.fav; markDirty(); refreshTables(); } return; }
  closeMenus();
  /* satellites */
  if(act==='sat-add'){ satModal(null); return; }
  if(act==='sat-edit'){ if(edSat==='all'){ toast('اختار قمر من القايمة الأول'); return; } satModal(satById(edSat)); return; }
  if(act==='sat-del'){
    if(edSat==='all'){ toast('اختار قمر من القايمة الأول'); return; }
    const s=satById(edSat); if(!s) return;
    confirmModal('حذف قمر','هيمسح قمر "'+esc(s.name)+'" وكل الترددات والقنوات اللي عليه. متأكد؟','حذف',()=>{
      editor.sats=editor.sats.filter(x=>x.id!==edSat);

    }); return;
  }

    const i=editor.sats.findIndex(s=>s.id===edSat);

    editor.sats=moveItem(editor.sats,i,act==='sat-up'?-1:1); markDirty(); render(); return;
  }

    const t=tpById(edTp); if(!t){ toast('اختار تردد من الجدول الأول'); return; }

      editor.tps=editor.tps.filter(x=>x.id!==edTp);
      editor.chs=editor.chs.filter(x=>x.tpId!==edTp);
      edTp=null; markDirty(); render();
    }); return;
  }
  /* channels */
  if(act==='ch-add'){ chModal(null); return; }
  if(act==='ch-edit'){ const c=chById(edCh); if(!c){ toast('اختار قناة من الجدول الأول'); return; } chModal(c); return; }
  if(act==='ch-del'){
    const c=chById(edCh); if(!c){ toast('اختار قناة من الجدول الأول'); return; }
    confirmModal('حذف قناة','هيمسح قناة "'+esc(c.name)+'". متأكد؟','حذف',()=>{
      editor.chs=editor.chs.filter(x=>x.id!==edCh); renumber(); edCh=null; markDirty(); render();
    }); return;
  }
  if(act==='ch-dup'){
    const c=chById(edCh); if(!c){ toast('اختار قناة من الجدول الأول'); return; }

  }
  if(act==='ch-up'||act==='ch-down'){
    const i=editor.chs.findIndex(c=>c.id===edCh);

  }

  if(act==='t-sort-name'){ editor.chs.sort((a,b)=>a.name.localeCompare(b.name,'ar')); chSort='file'; markDirty(); render(); toast('اترتب الملف حسب الاسم، استخدم تطبيق الترتيب لإعادة الترقيم'); return; }

    return;
  }
  /* file menu */
  if(act==='f-open'){ const f=$('#openFile'); if(f) f.click(); return; }
  if(act==='f-save'){ saveProject(); return; }
  if(act==='f-export'){ exportDialog(); return; }

      saveLS(LS_EDITOR,editor); render(); toast('اتفتح ملف جديد');
    }); return;
  }
}

function simReading(){
  const tp=simState.tp, mode=simState.mode;
  if(!tp) return '<div class="idle">اختار نقطة قياس من اللوحة (الدواير الخضرا) 👆</div>';
  const m=SIM_MEAS[tp] && SIM_MEAS[tp][mode];
  if(!m) return '<div class="idle">الوضع ده مش منطقي على النقطة دي.<br>جرب وضع تاني أو نقطة تانية.</div>';
  const f=simFault();
  const ov=(f.over[tp]&&f.over[tp][mode]);
  const val=ov?ov.f:m.h;
  const note=ov?ov.fnote:m.hnote;
  const tlabel=(SIM_TPS.find(t=>t.id===tp)||{}).label||tp;
  return '<div class="val">'+esc(val)+'</div><div class="unit">'+esc(m.u)+' · '+esc(SIM_MODES.find(x=>x.id===mode).label)+'</div><div class="tpn">'+esc(tlabel)+'</div>'+
    '<div class="simcmp"><div class="okb"><b>✔ لوحة سليمة</b>'+esc(m.h)+' '+esc(m.u)+'</div><div class="badb"><b>✘ العطل: '+esc(f.ok?'— (سليمة)':f.name)+'</b>'+(f.ok?'نفس القراءة السليمة':esc(val)+' '+esc(m.u))+'</div></div>'+
    '<div class="simproc"><b>الإجراء الصح:</b> '+esc(m.proc)+'<br><b>القراءة دي معناها:</b> '+esc(note||'')+'</div>';
}

function bindSim(){
  const view=$('#view');
  view.querySelectorAll('.simfaults button').forEach(b=>b.addEventListener('click',()=>{ simState.fault=b.dataset.f; rerenderSim(); }));
  view.querySelectorAll('.mbtns button').forEach(b=>b.addEventListener('click',()=>{ simState.mode=b.dataset.m; rerenderSim(); }));
  view.querySelectorAll('.tpdot').forEach(c=>c.addEventListener('click',()=>{ simState.tp=c.dataset.tp; rerenderSim(); }));
  const db=view.querySelector('#simDiagBtn');
  if(db) db.addEventListener('click',()=>{ simDiagType=(view.querySelector('#simType')||{}).value||''; simDiagFault=(view.querySelector('#simFaultQ')||{}).value||''; simDiagnose(); rerenderSim(); });
  view.querySelectorAll('[data-simg]').forEach(b=>b.addEventListener('click',()=>{ const g=SIM_GUIDED[b.dataset.simg]; simState.fault=b.dataset.simg; simState.mode=g.mode; simState.tp=g.tp; rerenderSim(); const gr=document.querySelector('.simgrid'); if(gr) gr.scrollIntoView({block:'start'}); }));
  view.querySelectorAll('[data-simq]').forEach(b=>b.addEventListener('click',()=>{ maintQ=b.dataset.simq||''; go('/maint'); }));
}
function rerenderSim(){
  const view=$('#view'); if(!view) return;
  view.innerHTML='<div class="wide">'+viewSim()+'</div>'; bindSim();
}

function maintListHtml(){
  const q=maintQ.trim();
  const list=MAINT_GUIDES.filter(g=>!q || (g.title+' '+g.keys+' '+g.fam).includes(q));
  if(!list.length) return '<div class="card"><p style="color:var(--mut)">مفيش دليل مطابق لبحثك لسه. ابعتلنا العطل أو الموديل وهنضيفه.</p></div>';
  return list.map(g=>{
    const svg=g.diagram==='smps'?svgSmps():(g.diagram==='boot'?svgBoot():(g.diagram==='signal'?svgSignal():(g.diagram==='rails'?svgRails():(g.diagram==='avout'?svgAvout():(g.diagram==='panel'?svgPanel():(g.diagram==='uart'?svgUart():''))))));
    return '<div class="mguide"><h3>'+esc(g.title)+'<span class="fam">'+esc(g.fam)+'</span></h3>'+
      (svg?'<div class="mdiagram">'+svg+'<div class="mdisc">'+esc(g.disc||'مخطط نموذجي عام للمعمارية الشائعة، مش schematic لموديل بعينه')+'</div></div>':'')+
      '<ol class="steps">'+g.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol></div>';
  }).join('');
}
function bindMaint(){
  const q=$('#maintQ'); if(q) q.addEventListener('input',()=>{ maintQ=q.value; const l=$('#maintList'); if(l) l.innerHTML=maintListHtml(); });
}

/* ---- home ---- */

  return '<a class="tile '+cls+'" href="#'+href+'"><span class="tic">'+icon+'</span><span class="tn">'+tn+'</span><span class="td">'+td+'</span></a>';

const ICO_CHIP='<svg viewBox="0 0 48 48" fill="none"><rect x="13" y="13" width="22" height="22" rx="4" stroke="#fff" stroke-width="2.6"/><rect x="20" y="20" width="8" height="8" rx="2" fill="#fff"/><path d="M18 13V7m6 6V7m6 6V7M18 41v-6m6 6v-6m6 6v-6M13 18H7m6 6H7m6 6H7m34-12h-6m6 6h-6m6 6h-6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';

const ICO_INFO='<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="17" stroke="#fff" stroke-width="2.6"/><path d="M24 21v11" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="15" r="2" fill="#fff"/></svg>';
function viewHome(){
  const c=edCounts();
  return '<div class="homehero"><div class="inner">'+
    '<h1 class="hometitle">ابوجبل <b>سات</b></h1>'+
    '<div class="hometag">برنامج الفني الكامل: محرر قنوات احترافي، مكتبة سوفتات، مرجع لودرات، وتصدير لكل الأجهزة</div>'+
  '</div></div>'+
  installCard()+
  '<div class="tiles">'+
    tile('/editor','teal',ICO_DISH,'محرر القنوات','أقمار وترددات وقنوات، ترتيب وتعريب وتصدير')+
    tile('/library','gold',ICO_FOLDER,'المكتبة','سوفتات وفلاشات وملفات قنوات متخزنة جوه البرنامج')+
    tile('/loaders','blue',ICO_CHIP,'اللودرات','مرجع اللودرات حسب المعالج بخطوات الشحن')+
    tile('/updates','teal',ICO_UPD,'التحديثات','سوفتات وتحويلات وملفات قنوات بتحميل مباشر، بتتجدد باستمرار')+
    tile('/convert','purple',ICO_CONVERT,'التحويل','إيه الممكن في التحويل بين الأجهزة بصراحة')+
    tile('/about','slate',ICO_INFO,'حول البرنامج','التثبيت والحفظ وتوصيل OTG')+
  '</div>'+
  '<div class="card"><h2>ملف القنوات الحالي</h2><div class="facts">'+
    '<div class="fact"><div class="k">الأقمار</div><div class="v">'+c.sats+'</div></div>'+
    '<div class="fact"><div class="k">الترددات</div><div class="v">'+c.tps+'</div></div>'+
    '<div class="fact"><div class="k">قنوات TV</div><div class="v">'+c.tv+'</div></div>'+
    '<div class="fact"><div class="k">راديو</div><div class="v">'+c.radio+'</div></div>'+
  '</div><div class="caption">'+esc(editor.fileName||'')+'</div></div>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-sec" id="shareBtn">مشاركة البرنامج</button><a class="btn btn-ghost" href="#/editor" style="text-decoration:none;display:inline-flex;align-items:center">افتح المحرر</a></div>';

function bindHome(){
  const b=$('#installBtn'); if(b) b.addEventListener('click',doInstall);
  const sh=$('#shareBtn'); if(sh) sh.addEventListener('click',async ()=>{
    const data={title:'ابوجبل سات',text:'محرر القنوات الاحترافي للفنيين',url:location.href};
    try{ if(navigator.share){ await navigator.share(data); } else { throw 0; } }
    catch(e){
      try{ await navigator.clipboard.writeText(location.href); toast('اتنسخ لينك البرنامج'); }
      catch(e2){ toast('انسخ اللينك من شريط العنوان'); }
    }
  });
}
/* ================= render ================= */
function render(){
  renderTabs();
  const p=currentPath();
  const view=$('#view');
  if(p==='/library'){ view.innerHTML='<div class="narrow">'+viewLibrary()+'</div>'; bindLibrary(); }
  else if(p==='/loaders'){ view.innerHTML='<div class="narrow">'+viewLoaders()+'</div>'; bindLoaders(); }
  else if(p==='/updates'){ view.innerHTML='<div class="narrow">'+viewUpdates()+'</div>'; bindUpdates(); }
  else if(p==='/maint'){ view.innerHTML='<div class="narrow">'+viewMaint()+'</div>'; bindMaint(); }
  else if(p==='/sim'){ view.innerHTML='<div class="wide">'+viewSim()+'</div>'; bindSim(); }
  else if(p==='/convert'){ view.innerHTML='<div class="narrow">'+viewConvert()+'</div>'; }
  else if(p==='/about'){ view.innerHTML=viewAbout(); const b=$('#installBtn'); if(b) b.addEventListener('click',doInstall); }
  else if(p==='/lab'){ view.innerHTML=viewLab(); bindLab(); }
  else if(p==='/editor'){ view.innerHTML=viewEditor(); bindEditor(); }
  else { view.innerHTML=viewHome(); bindHome(); }
}
window.addEventListener('hashchange', render);
/* ================= boot ================= */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]');
  if(b) go(b.dataset.tab);
});
(async function(){
  db=await openDB();
  const vc=document.getElementById('verchip');
  if(vc) vc.textContent='نسخة '+APP_VER+' · بنية '+APP_BUILD;
  if('serviceWorker' in navigator){
    try{
      const reg=await navigator.serviceWorker.register('sw.js');
      try{ reg.update(); }catch(e){}
      setInterval(()=>{ try{ reg.update(); }catch(e){} }, 5*60*1000);
      let reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!reloaded){ reloaded=true; location.reload(); } });
    }catch(e){}
  }
  render();
})();
</script>
